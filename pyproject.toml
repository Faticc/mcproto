[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcproto"
version = "0.1.0"
description = "Mcskill proto"
authors = [{ name = "Faticc", email = "komeristyj07@gmail.com" }]
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=5.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mcproto*"]

[project.urls]
Homepage = "https://github.com/Faticc/mcproto"
